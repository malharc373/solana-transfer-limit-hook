name: Compute units

on: pull_request

jobs:
  cu-guard:
    permissions:
      contents: read
      pull-requests: write # for the comment
    uses: malharc373/solana-cu-guard/.github/workflows/compare.yml@v1.2.0
    with:
      solana-version: v4.3.2
      command: cargo build-sbf && cargo test cu_report
